name: Build PHF Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name phf \
            --org com.paraghariyani \
            .

      - name: Get packages
        run: flutter pub get

      - name: Build PHF APK
        run: flutter build apk --release

      - name: Upload PHF APK
        uses: actions/upload-artifact@v4
        with:
          name: PHF-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
